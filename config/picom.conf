# Rule-based per-window options.
#
# NOTE: since picom v12, "rules" supersedes the old-style options
# (wintypes, shadow-exclude, inactive-dim, shadow-ignore-shaped, ...).
# Setting both makes picom warn and ignore the old-style ones, so all
# per-window behaviour lives in this block now.
#
# Rules are matched top to bottom; if the same property is set by more
# than one matching rule, THE LAST ONE WINS.
#
# 'WINDOW_TYPE' is one of the 15 window types defined in EWMH standard:
#     "unknown", "desktop", "dock", "toolbar", "menu", "utility",
#     "splash", "dialog", "normal", "dropdown_menu", "popup_menu",
#     "tooltip", "notification", "combo", and "dnd".
rules: ({
  match = "window_type = 'normal'";
  shadow = true;
  full-shadow = false;
}, {
  match = "window_type = 'toolbar'";
  shadow = false;
}, {
  match = "window_type = 'popup_menu'";
  opacity = 1; shadow = false; full-shadow=true; 
}, {
  match = "window_type = 'dropdown_menu'";
  opacity = 1; full-shadow=true; shadow = false; 
}, {
  match = "window_type = 'utility'";
  opacity = 1; shadow = false; 
},{
  match = "window_type = 'tooltip'";
  fade = true; shadow = false; opacity = 0.75; full-shadow = true;
}, {
  # migrated from the old "wintypes" block
  match = "window_type = 'dock'   || "
          "window_type = 'dnd'    || "
          "window_type = 'splash' || "
          "window_type = 'dialog' || "
          "window_type = 'combo'";
  shadow = false;
}, {
  match = "window_type = 'dock'    || "
          "window_type = 'desktop' || "
          "_GTK_FRAME_EXTENTS@";
  blur-background = false;
}, {
  match = "window_type = 'dock' || "
          "window_type = 'desktop' || "
          "! name~=''";
  corner-radius = 0;
}, {
  match = "! name~=''              || "
          "name = 'Notification'   || "
          "class_g = 'Conky'       || "
          "class_g ?= 'Notify-osd' || "
          "class_g = 'Cairo-clock' || "
          "_GTK_FRAME_EXTENTS@";
  shadow = false;
}, { 
  match = "fullscreen"; corner-radius = 0; 
}, { 
  # match = "_NET_FRAME_EXTENTS@[0] = 0 && _NET_FRAME_EXTENTS@[1] = 0"; 
  match = "_NET_FRAME_EXTENTS@[0] = 0"; 
  corner-radius = 0; 
}, {
  # migrated from the old "shadow-ignore-shaped = true"
  match = "bounding_shaped && !rounded_corners";
  shadow = false;
}, {
  # migrated from the old "inactive-dim = 0.05"
  # (group_focused needs detect-transient, set further down)
  match = "!focused && !group_focused";
  dim = 0.05;
},
);


#################################
#           Corners             #
#################################

# Sets the radius of rounded window corners. When > 0, the compositor will
# round the corners of windows. Does not interact well with
# `transparent-clipping`.
#
# Default: 0 (disabled)
corner-radius = 5;

#exclude windows with no name such as qtile's bar
# handled by the corner-radius rules above

#################################
#             Shadows           #
#################################

# Enabled client-side shadows on windows. Note desktop windows
# (windows with '_NET_WM_WINDOW_TYPE_DESKTOP') never get shadow,
# unless explicitly requested using rules.
#
# Can be set per-window using rules.
shadow = true;
shadow-radius = 12;

# The left offset for shadows, in pixels.
shadow-offset-x = -7;
shadow-offset-y = -7;

# NOTE: "shadow-ignore-shaped" is superseded by rules -- see the
# "bounding_shaped && !rounded_corners" rule above.

#################################
#           Fading              #
#################################
fading = false;

#################################
#   Transparency / Opacity      #
#################################
frame-opacity = 1.0;
inactive-dim-fixed = true;

# NOTE: "inactive-dim" is superseded by rules -- see the
# "!focused && !group_focused" rule above.

#################################
#            Blur               #
#################################

blur-kern = "3x3box";

#################################
#       General Settings        #
#################################

# Enable remote control via D-Bus. See the man page for more details.
#
# Default: false
# dbus = true

# Daemonize process. Fork to background after initialization. Causes issues with certain (badly-written) drivers.
daemon = true

# Specify the backend to use: `xrender`, `glx`, or `egl`.
backend = "xrender"

dithered-present = false;

vsync = true;

detect-rounded-corners = true;

detect-client-opacity = true;

detect-transient = true;

use-damage = true;

# Set the log level. Possible values are:
#  "trace", "debug", "info", "warn", "error"
# in increasing level of importance. Case insensitive.
# If using the "TRACE" log level, it's better to log into a file
# using *--log-file*, since it can generate a huge stream of logs.
#
# Default: "warn"
# log-level = "warn";

# Set the log file.
# If *--log-file* is never specified, logs will be written to stderr.
# Otherwise, logs will to written to the given file, though some of the early
# logs might still be written to the stderr.
# When setting this option from the config file, it is recommended to use an absolute path.
#
# log-file = "/path/to/your/log/file"

# Write process ID to a file.
# write-pid-path = "/path/to/your/log/file"

# `@include` directive can be used to include additional configuration files.
# Relative paths are search either in the parent of this configuration file
# (when the configuration is loaded through a symlink, the symlink will be
# resolved first). Or in `$XDG_CONFIG_HOME/picom/include`.
#
# @include "extra.conf"
